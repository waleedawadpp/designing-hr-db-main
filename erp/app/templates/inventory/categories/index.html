{% extends 'base.html' %}
{% block title %}الفئات{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4>فئات الأصناف</h4>
  <a href="{{ url_for('inventory.new_category') }}" class="btn btn-primary">+ إضافة فئة</a>
</div>
<table class="table table-bordered table-hover">
  <thead class="table-light"><tr><th>#</th><th>الاسم</th><th>الفئة الأب</th><th></th></tr></thead>
  <tbody>
  {% for c in categories %}
  <tr>
    <td>{{ c.id }}</td>
    <td>{{ c.name }}</td>
    <td>{{ c.parent.name if c.parent else '—' }}</td>
    <td><a href="{{ url_for('inventory.edit_category', id=c.id) }}" class="btn btn-sm btn-outline-secondary">تعديل</a></td>
  </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
