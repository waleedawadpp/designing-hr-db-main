{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h4>{{ title }}</h4>
<form method="POST" novalidate>
  {{ form.hidden_tag() }}
  <div class="mb-3">{{ form.name.label }} {{ form.name(class='form-control') }}</div>
  <div class="mb-3">{{ form.parent_id.label }} {{ form.parent_id(class='form-select') }}</div>
  <button class="btn btn-primary">حفظ</button>
  <a href="{{ url_for('inventory.categories') }}" class="btn btn-secondary">إلغاء</a>
</form>
{% endblock %}
