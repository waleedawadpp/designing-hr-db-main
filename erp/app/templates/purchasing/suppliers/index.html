{% extends 'base.html' %}
{% block title %}الموردون{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4>الموردون</h4>
  <a href="{{ url_for('purchasing.new_supplier') }}" class="btn btn-primary">+ إضافة مورد</a>
</div>
<table class="table table-bordered table-hover">
  <thead class="table-light"><tr><th>#</th><th>الاسم</th><th>الدولة</th><th>الهاتف</th><th>أجل الدفع</th><th></th></tr></thead>
  <tbody>
  {% for s in suppliers %}
  <tr>
    <td>{{ s.id }}</td><td>{{ s.name }}</td><td>{{ s.country or '—' }}</td>
    <td>{{ s.phone or '—' }}</td><td>{{ s.payment_terms }} يوم</td>
    <td><a href="{{ url_for('purchasing.edit_supplier', id=s.id) }}" class="btn btn-sm btn-outline-secondary">تعديل</a></td>
  </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
