{% extends 'base.html' %}
{% block title %}لوحة التحكم{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="mb-0"><i class="bi bi-speedometer2 me-2 text-primary"></i>لوحة التحكم</h4>
</div>

<div class="row g-4 mb-4">
  <div class="col-md-3">
    <div class="card text-white bg-primary">
      <div class="card-body">
        <div class="d-flex justify-content-between">
          <div>
            <div class="small opacity-75">المبيعات اليوم</div>
            <div class="fs-4 fw-bold">0.000</div>
          </div>
          <i class="bi bi-receipt fs-1 opacity-25"></i>
        </div>
      </div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card text-white bg-success">
      <div class="card-body">
        <div class="d-flex justify-content-between">
          <div>
            <div class="small opacity-75">التحصيلات</div>
            <div class="fs-4 fw-bold">0.000</div>
          </div>
          <i class="bi bi-cash-stack fs-1 opacity-25"></i>
        </div>
      </div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card text-white bg-warning">
      <div class="card-body">
        <div class="d-flex justify-content-between">
          <div>
            <div class="small opacity-75">الذمم المدينة</div>
            <div class="fs-4 fw-bold">0.000</div>
          </div>
          <i class="bi bi-people fs-1 opacity-25"></i>
        </div>
      </div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card text-white bg-danger">
      <div class="card-body">
        <div class="d-flex justify-content-between">
          <div>
            <div class="small opacity-75">تنبيهات المخزون</div>
            <div class="fs-4 fw-bold">0</div>
          </div>
          <i class="bi bi-exclamation-triangle fs-1 opacity-25"></i>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body text-center py-5 text-muted">
    <i class="bi bi-bar-chart-line fs-1 mb-3 d-block"></i>
    <p>سيتم عرض الرسوم البيانية هنا بعد إضافة البيانات</p>
  </div>
</div>
{% endblock %}
