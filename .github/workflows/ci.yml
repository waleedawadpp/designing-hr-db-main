name: RAF Marketplace CI

on:
  push:
    paths:
      - "RAF_Marketplace_DB/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "RAF_Marketplace_DB/**"
      - ".github/workflows/ci.yml"

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RAF_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/raf_test
      RAF_JWT_SECRET: ci-test-secret-key-at-least-32-bytes-long
      PGPASSWORD: postgres
      PYTHONPATH: .

    defaults:
      run:
        working-directory: RAF_Marketplace_DB/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: RAF_Marketplace_DB/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Schema applies cleanly
        run: |
          psql -h localhost -U postgres -d raf_test -v ON_ERROR_STOP=1 -f ../schema.sql
          psql -h localhost -U postgres -d raf_test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"

      - name: Alembic migration round-trip (on a clean DB)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run tests
        # conftest drops & recreates the schema itself, so prior state is irrelevant.
        run: pytest -q
